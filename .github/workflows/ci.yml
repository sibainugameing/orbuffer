name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Cargo.toml"
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "frontend/**"
      - "src-tauri/**"
      - "vitest.config.ts"
      - "scripts/**"
  push:
    branches:
      - "v*"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: orbuffer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf             libfuse2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Check root Rust formatting
        run: cargo fmt --manifest-path Cargo.toml -- --check

      - name: Test root Rust package
        run: cargo test --all-targets

      - name: Check Tauri Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Tauri Rust package
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  aria2-integration:
    name: aria2 local integration
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install aria2
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run local aria2 integration test
        run: cargo test --all-targets -- --ignored
